# Infrastructure shared by both examples, so the only thing that differs
# between them is pipeline shape.
#
# Host ports are deliberately odd — 5455 rather than 5432, 9200 rather than
# 9000 — because these run alongside whatever else is already on the machine,
# and the obvious alternatives were taken too. Override with the *_PORT
# variables if they still collide.

name: ragit-examples

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      # A superuser, deliberately. Bootstrap migrates as this role and then
      # creates the unprivileged role the examples actually connect as —
      # PostgreSQL exempts superusers from row-level security, so an example
      # that ran as this role would demonstrate an isolation it does not have.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragit_examples
    ports:
      - "${POSTGRES_PORT:-5455}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragit_examples"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # Mounted at /var/lib/postgresql, not .../data. The PostgreSQL 18 images
      # moved the data directory into a version-named subdirectory so that
      # pg_upgrade --link works across a mount boundary; a volume on the old
      # path makes the container refuse to start.
      - pgdata:/var/lib/postgresql

  xberg:
    image: ghcr.io/xberg-io/xberg:latest
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${XBERG_PORT:-8234}:8000"
    # No healthcheck: the image's shell tooling is not something to depend on,
    # and `go run ./verify` already gates on GET /health. First boot is slow —
    # xberg downloads models on demand, including the local ONNX embedding
    # presets the xberg-owned example uses.
    volumes:
      - xbergcache:/root/.cache

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9200}:9000"
      - "${MINIO_CONSOLE_PORT:-9201}:9001"
    # Likewise gated by verify rather than by a healthcheck.
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  xbergcache:
  miniodata:
