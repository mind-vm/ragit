# The test suite is integration-first: testcontainers boots a pgvector-enabled
# Postgres and the RLS, migration and retrieval tests run against it. Nothing
# here mocks the database, so the runner needs Docker — which the GitHub-hosted
# ubuntu images have, and which is the whole reason this workflow is not just
# `go test -short`.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Postgres via testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      # Its own module with a `replace` back to the root, so a library change
      # that breaks a consumer shows up here rather than the next time someone
      # runs the examples by hand.
      - name: examples build and vet
        working-directory: examples
        run: |
          go build ./...
          go vet ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum

      # Installed from the module proxy at a pinned version rather than
      # through golangci-lint-action, so the version here is the same string
      # a developer runs locally and the download is checksum-verified like
      # any other dependency.
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: lint
        run: golangci-lint run ./...

      - name: lint examples
        working-directory: examples
        run: golangci-lint run ./...
